<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="photoFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071710"/>
      <stop offset=".4" stop-color="#071710" stop-opacity=".95"/>
      <stop offset=".72" stop-color="#071710" stop-opacity=".2"/>
      <stop offset="1" stop-color="#071710" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8a641"/>
      <stop offset=".5" stop-color="#edc66e"/>
      <stop offset="1" stop-color="#d39a31"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071710" stop-opacity="0"/>
      <stop offset="1" stop-color="#071710" stop-opacity=".86"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".7"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="16" r="1" fill="#fff" opacity=".035"/>
      <circle cx="50" cy="42" r=".8" fill="#fff" opacity=".025"/>
      <circle cx="73" cy="11" r=".7" fill="#fff" opacity=".02"/>
      <circle cx="25" cy="76" r=".9" fill="#fff" opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#071710"/>
  <image href="hero-kw023259.jpg" x="0" y="0" width="1200" height="800" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="800" fill="url(#photoFade)"/>
  <rect y="410" width="1200" height="390" fill="url(#bottomFade)"/>
  <rect width="1200" height="800" fill="url(#grain)"/>

  <g fill="#e6b554" opacity=".58" filter="url(#glow)">
    <circle cx="1012" cy="77" r="3"/>
    <circle cx="1082" cy="132" r="2.5"/>
    <circle cx="1140" cy="52" r="3.5"/>
    <circle cx="967" cy="172" r="2"/>
    <circle cx="1115" cy="199" r="2.2"/>
    <circle cx="1050" cy="237" r="2.8"/>
  </g>

  <g transform="translate(64 88)" filter="url(#shadow)">
    <text x="0" y="0" fill="#e6b554" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4">EIN WEIHNACHTSWUNDER MIT HERZ</text>
    <path d="M0 22h78" stroke="#e6b554" stroke-width="3"/>
    <text x="0" y="148" fill="#f7f1e5" font-family="Georgia, 'Times New Roman', serif" font-size="83" font-weight="700" letter-spacing="-2">WEIHNACHTSHAUS</text>
    <text x="3" y="215" fill="#e6b554" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-style="italic" font-weight="700">Bad Tatzmannsdorf</text>
  </g>

  <g transform="translate(64 604)">
    <rect x="0" y="0" width="890" height="108" fill="url(#goldBar)"/>
    <rect x="0" y="0" width="8" height="108" fill="#f7f1e5" opacity=".76"/>
    <text x="42" y="68" fill="#071710" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800" letter-spacing="1.5">21. NOV. 2026 BIS 6. JÄN. 2027</text>
  </g>

  <text x="64" y="756" fill="#f7f1e5" opacity=".92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">STAUNEN · TEILEN · HELFEN</text>
</svg>
